version: '3.8'

services:
  taiji-verify:
    build: .
    image: taiji-verify:2.0.0
    container_name: taiji-verify-api
    ports:
      - "8080:8080"
    environment:
      - TAIJI_EMBEDDING_DIM=768
      - TAIJI_DELTA_THRESHOLD=0.6
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
